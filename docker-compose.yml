# Платформа обучения: приложение + PostgreSQL.
# Рассчитано на сервер, где уже работают другие CRM:
#   — свой project name (platforma) и своя сеть, имена контейнеров не пересекаются;
#   — база наружу не открыта, доступна только внутри сети проекта;
#   — приложение слушает только 127.0.0.1:${APP_PORT}, наружу его отдаёт ваш nginx/traefik.
name: platforma

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platforma}
      POSTGRES_USER: ${POSTGRES_USER:-platforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./web
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platforma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platforma}
      SEED_DEMO: ${SEED_DEMO:-0}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      APP_TZ: ${APP_TZ:-Asia/Almaty}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platforma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platforma}
      APP_TZ: ${APP_TZ:-Asia/Almaty}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
