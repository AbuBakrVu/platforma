# Платформа обучения: приложение + PostgreSQL.
# Рассчитано на сервер, где уже работают другие CRM:
#   — свой project name (platforma) и своя сеть, имена контейнеров не пересекаются;
#   — база наружу не открыта, доступна только внутри сети проекта;
#   — приложение слушает только 127.0.0.1:${APP_PORT}, наружу его отдаёт ваш nginx/traefik;
#   — если своего прокси нет, профиль caddy сам получит HTTPS-сертификат для APP_DOMAIN
#     (COMPOSE_PROFILES=caddy в .env, нужны свободные порты 80 и 443);
#   — профиль office добавляет Gotenberg (LibreOffice): Word/PowerPoint/Excel открываются в браузере как PDF
#     (COMPOSE_PROFILES=office и CONVERTER_URL=http://gotenberg:3000; профили перечисляются через запятую);
#   — профиль labs добавляет сервис лабораторий: контейнеры студентов с терминалом в браузере.
#     Ему нужен Docker хоста (docker.sock) — прочитайте раздел «Лаборатории» в README.
# Проще всего ставить через ./install.sh — он спросит домен и администратора и всё настроит.
name: platforma

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platforma}
      POSTGRES_USER: ${POSTGRES_USER:-platforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./web
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platforma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platforma}
      SEED_DEMO: ${SEED_DEMO:-0}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      APP_TZ: ${APP_TZ:-Asia/Almaty}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platforma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platforma}
      APP_TZ: ${APP_TZ:-Asia/Almaty}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      CONVERTER_URL: ${CONVERTER_URL:-}
      LAB_RUNNER_URL: ${LAB_RUNNER_URL:-}
      LAB_SECRET: ${LAB_SECRET:-}
    volumes:
      # Видео, документы, SCORM-пакеты. Делайте резервную копию вместе с базой.
      - uploads:/data/uploads
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  labs:
    build: ./labs
    profiles: ["labs"]
    restart: unless-stopped
    environment:
      LAB_SECRET: ${LAB_SECRET:-}
      MAX_SESSIONS: ${LAB_MAX_SESSIONS:-20}
    volumes:
      # Управление контейнерами студентов. Это равносильно root-доступу к серверу — см. README
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # WebSocket терминала: прокси отдаёт /lab-ws/ сюда
      - "127.0.0.1:${LAB_PORT:-3200}:3200"

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: ["office"]
    restart: unless-stopped
    # Наружу не открыт: доступен приложению внутри сети проекта

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
