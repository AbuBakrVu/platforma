<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9D3C3"/><stop offset=".55" stop-color="#E4EBDD"/><stop offset="1" stop-color="#F4EEDD"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1E6" stop-opacity="0"/><stop offset="1" stop-color="#F4F1E6" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE6DF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <circle cx="430" cy="300" r="46" fill="#FBF6E6"/>
  <circle cx="430" cy="300" r="90" fill="#FBF6E6" opacity=".25"/>
