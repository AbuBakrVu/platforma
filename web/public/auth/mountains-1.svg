  <path d="M0 520 L70 450 L120 480 L190 380 L240 430 L300 330 L360 420 L410 390 L470 450 L530 400 L600 460 V900 H0Z" fill="#9DB9A7"/>
  <path d="M190 380 L215 405 L205 410 L225 420 L240 430 L230 412 Z M300 330 L330 375 L315 372 L322 392 L300 370 L285 360 Z M530 400 L548 418 L538 418 L545 428 Z" fill="url(#snow)" opacity=".9"/>
  <rect y="430" width="600" height="160" fill="url(#fog)"/>
  <!-- средний -->
  <path d="M0 600 L60 560 L110 585 L170 520 L230 575 L290 540 L340 580 L400 510 L460 565 L520 535 L600 580 V900 H0Z" fill="#6F977F"/>
  <rect y="560" width="600" height="120" fill="url(#fog)" opacity=".6"/>
